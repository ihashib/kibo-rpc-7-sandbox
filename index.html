  <style>
    /* Bangla and English side by side: lang.js shows one (Bangla unless English was chosen). */
    html[data-lang="bn"] .en, html[data-lang="en"] .bn { display: none !important; }
    html[data-lang="bn"] body { line-height: 1.75; }
    nav.tabs .langsw { flex: none; margin-left: auto; align-self: center; padding: 3px 12px; border: 1px solid var(--border); border-radius: 999px; color: var(--fg); font-size: 13.5px; font-weight: 600; }
    nav.tabs .langsw:hover { border-color: var(--accent); color: var(--accent); }
    @media (max-width: 480px) { nav.tabs .langsw { flex: none; min-height: 32px; padding: 0 9px; margin: 0 0 0 4px; border-radius: 999px; font-size: 12.5px; } }
    /* Phones and tablets: the language button sits above the tabs, top right, so the six tabs keep the row. */
    @media (max-width: 860px) { main { position: relative; } nav.tabs .langsw { position: absolute; top: 1px; right: 16px; margin: 0; min-height: 0; padding: 1px 10px; font-size: 12.5px; line-height: 1.5; } }
    @media (max-width: 380px) { html[data-lang="en"] nav.tabs a { padding: 0 2px; font-size: 12.5px; } }
    :root { color-scheme: dark; --bg: #0d1016; --fg: #e6e9f0; --muted: #9aa3b5; --border: #2c3342; --code: #161a23; --accent: #86a2ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 0; }
    .full { padding: 0 16px; }
    .sig { max-width: 960px; margin: 0 auto; padding: 14px 16px 32px; color: var(--muted); font-size: 14px; }
    h1 { font-size: 28px; margin: 0 0 4px; }
    nav.tabs { display: flex; gap: 2px; margin: 0 0 18px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
    nav.tabs a { flex: none; padding: 8px 14px; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap; }
    nav.tabs a:hover { color: var(--fg); }
    nav.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
    nav.tabs a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    nav.tabs a:active { color: var(--fg); background: color-mix(in srgb, var(--accent) 14%, transparent); }
    /* Phones: the tabs share the row and are full-height touch targets (44px). */
    @media (max-width: 480px) { nav.tabs { gap: 0; } nav.tabs a { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 44px; box-sizing: border-box; padding: 0 6px; font-size: 14px; border-radius: 8px 8px 0 0; } }
    @media (max-width: 400px) { nav.tabs a { padding: 0 3px; font-size: 13px; min-width: 44px; flex-shrink: 0; } }
    @media (max-width: 340px) { nav.tabs { margin-left: -8px; margin-right: -8px; } nav.tabs a { padding: 0 2px; font-size: 12.5px; } }
    /* Phones and tablets: shorter tab names so all six fit (the full name stays as the link's accessible name). */
    nav.tabs .ts { display: none; }
    @media (max-width: 860px) { nav.tabs .tl { display: none; } nav.tabs .ts { display: inline; } }
    a { color: var(--accent); }
  </style>
  <script src="dist/kibo-nav-sandbox.js"></script>
</head>
